  /api/admin/usage-report:
    get:
      description: >-
        Get the usage counts that the usage telemetry job reports, for the
        creation window [start, end).

        Reads only this deployment's own databases and makes no outbound network
        call, so deployments that set `LANGFUSE_DISABLE_OUTBOUND` can produce
        the usage report on demand.

        Returns 400 when a parameter is not an ISO 8601 datetime or when start
        is not before end.
      operationId: organizations_getUsageReport
      tags:
        - Organizations
      parameters:
        - name: start
          in: query
          description: >-
            Inclusive start of the creation window (ISO 8601 datetime, a UTC
            offset is allowed). Defaults to 30 days before end.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: end
          in: query
          description: >-
            Exclusive end of the creation window (ISO 8601 datetime, a UTC
            offset is allowed). Defaults to the time of the request.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          description: ''
          content:
            application/json:
              schema:
