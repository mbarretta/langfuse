            application/json:
              schema:
                type: string
      security: *ref_0
components:
  schemas:
    Organizations:
      title: Organizations
      type: object
      description: List of organizations
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
      required:
        - organizations
    Organization:
      title: Organization
      type: object
      description: Organization object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Metadata for the organization
        projects:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationProject'
      required:
        - id
        - name
        - createdAt
        - metadata
        - projects
    OrganizationProject:
      title: OrganizationProject
      type: object
      description: Project belonging to an organization
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Metadata for the project
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt
    DeleteOrganizationResponse:
      title: DeleteOrganizationResponse
      type: object
      description: Response for successful organization deletion
      properties:
        success:
          type: boolean
      required:
        - success
    ApiKeyList:
      title: ApiKeyList
      type: object
      description: List of API keys for an organization
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
      required:
        - apiKeys
    ApiKeySummary:
      title: ApiKeySummary
      type: object
      description: Summary of an API key
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        publicKey:
          type: string
        displaySecretKey:
          type: string
      required:
        - id
        - createdAt
        - publicKey
        - displaySecretKey
    ApiKeyResponse:
      title: ApiKeyResponse
      type: object
      description: Response for API key creation
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        publicKey:
          type: string
        secretKey:
          type: string
        displaySecretKey:
          type: string
        note:
          type: string
          nullable: true
      required:
        - id
        - createdAt
        - publicKey
        - secretKey
        - displaySecretKey
    UsageReport:
      title: UsageReport
      type: object
      description: Instance-wide usage counts for a creation window
      properties:
        window:
          $ref: '#/components/schemas/UsageReportWindow'
          description: The creation window [start, end) that the interval counts cover
        generatedAt:
          type: string
          format: date-time
          description: When the report was generated
        langfuseVersion:
          type: string
          description: Version of the Langfuse deployment that generated the report
        clientId:
          type: string
          nullable: true
          description: >-
            Identifier of this deployment as used by the usage telemetry job, or
            null if the telemetry job has never run
        licenseKeySuffix:
          type: string
          nullable: true
          description: >-
            Last 4 characters of LANGFUSE_EE_LICENSE_KEY, so a report can be
            matched to a contract without exposing the key. Null when no license
            key is set or the key is 8 characters or shorter.
        billableUnits:
          type: integer
          description: Sum of traces, observations and scores
        totalProjects:
          type: integer
          description: >-
            Current number of projects that are not deleted. This is a current
            total, not a count for the window.
        traces:
          type: integer
          description: Traces created in the window
        scores:
          type: integer
          description: Scores created in the window
        observations:
          type: integer
          description: Observations created in the window
        datasets:
          type: integer
          description: Datasets created in the window
        datasetItems:
          type: integer
          description: Dataset items created in the window
        datasetRuns:
          type: integer
          description: Dataset runs created in the window
        datasetRunItems:
          type: integer
          description: Dataset run items created in the window
        assistantRuns:
          type: integer
          description: Assistant runs created in the window
        userDomains:
          type: array
          items:
            $ref: '#/components/schemas/UsageReportUserDomain'
          description: >-
            The 30 email domains with the most users and their user counts, most
            users first. Like totalProjects, this is a current total, not a
            count for the window.
      required:
        - window
        - generatedAt
        - langfuseVersion
        - clientId
        - licenseKeySuffix
        - billableUnits
        - totalProjects
        - traces
        - scores
        - observations
        - datasets
        - datasetItems
        - datasetRuns
        - datasetRunItems
        - assistantRuns
        - userDomains
    UsageReportWindow:
      title: UsageReportWindow
      type: object
      description: Creation window of a usage report
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive start of the window
        end:
          type: string
          format: date-time
          description: Exclusive end of the window
      required:
        - start
        - end
    UsageReportUserDomain:
      title: UsageReportUserDomain
      type: object
      description: Number of users with an email address at a domain
      properties:
        domain:
          type: string
        userCount:
          type: integer
      required:
        - domain
        - userCount
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
