# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  commons: ./commons.yml

service:
  auth: true
  base-path: /api/admin
  endpoints:
    getAll:
      docs: Get all organizations
      method: GET
      path: /organizations
      response: Organizations
      errors:
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    create:
      docs: Create a new organization
      method: POST
      path: /organizations
      request:
        name: CreateOrganizationRequest
        body:
          properties:
            name: string
            metadata:
              type: optional<map<string, unknown>>
              docs: Optional metadata for the organization
      response: Organization
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    getById:
      docs: Get organization by ID
      method: GET
      path: /organizations/{organizationId}
      path-parameters:
        organizationId: string
      response: Organization
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    update:
      docs: Update an organization
      method: PUT
      path: /organizations/{organizationId}
      path-parameters:
        organizationId: string
      request:
        name: UpdateOrganizationRequest
        body:
          properties:
            name: string
            metadata:
              type: optional<map<string, unknown>>
              docs: Optional metadata for the organization
      response: Organization
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    delete:
      docs: Delete an organization
      method: DELETE
      path: /organizations/{organizationId}
      path-parameters:
        organizationId: string
      response: DeleteOrganizationResponse
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    # API Key endpoints
    getApiKeys:
      docs: Get all API keys for an organization
      method: GET
      path: /organizations/{organizationId}/apiKeys
      path-parameters:
        organizationId: string
      response: ApiKeyList
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    createApiKey:
      docs: Create a new API key for an organization
      method: POST
      path: /organizations/{organizationId}/apiKeys
      path-parameters:
        organizationId: string
      request:
        name: CreateApiKeyRequest
        body:
          properties:
            note:
              type: optional<string>
              docs: Optional note for the API key
      response: ApiKeyResponse
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    deleteApiKey:
      docs: Delete an API key for an organization
      method: DELETE
      path: /organizations/{organizationId}/apiKeys/{apiKeyId}
      path-parameters:
        organizationId: string
        apiKeyId: string
      response: DeleteOrganizationResponse
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

    # Usage report
    getUsageReport:
      docs: |
        Get the usage counts that the usage telemetry job reports, for the creation window [start, end).
        Reads only this deployment's own databases and makes no outbound network call, so deployments that set `LANGFUSE_DISABLE_OUTBOUND` can produce the usage report on demand.
        Returns 400 when a parameter is not an ISO 8601 datetime or when start is not before end.
      method: GET
      path: /usage-report
      request:
        name: GetUsageReportRequest
        query-parameters:
          start:
            type: optional<datetime>
            docs: Inclusive start of the creation window (ISO 8601 datetime, a UTC offset is allowed). Defaults to 30 days before end.
          end:
            type: optional<datetime>
            docs: Exclusive end of the creation window (ISO 8601 datetime, a UTC offset is allowed). Defaults to the time of the request.
      response: UsageReport
      errors:
        - commons.Error
        - commons.UnauthorizedError
        - commons.MethodNotAllowedError

types:
  Organizations:
    docs: List of organizations
    properties:
      organizations: list<Organization>

  Organization:
    docs: Organization object
    properties:
      id: string
      name: string
      createdAt: datetime
      metadata:
        type: map<string, unknown>
        docs: Metadata for the organization
      projects: list<OrganizationProject>

  OrganizationProject:
    docs: Project belonging to an organization
    properties:
      id: string
      name: string
      metadata:
        type: optional<map<string, unknown>>
        docs: Metadata for the project
      createdAt: datetime
      updatedAt: datetime

  DeleteOrganizationResponse:
    docs: Response for successful organization deletion
    properties:
      success: boolean

  ApiKeyList:
    docs: List of API keys for an organization
    properties:
      apiKeys: list<ApiKeySummary>

  ApiKeySummary:
    docs: Summary of an API key
    properties:
      id: string
      createdAt: datetime
      expiresAt: optional<datetime>
      lastUsedAt: optional<datetime>
      note: optional<string>
      publicKey: string
      displaySecretKey: string

  ApiKeyResponse:
    docs: Response for API key creation
    properties:
      id: string
      createdAt: datetime
      publicKey: string
      secretKey: string
      displaySecretKey: string
      note: optional<string>

  UsageReport:
    docs: Instance-wide usage counts for a creation window
    properties:
      window:
        type: UsageReportWindow
        docs: The creation window [start, end) that the interval counts cover
      generatedAt:
        type: datetime
        docs: When the report was generated
      langfuseVersion:
        type: string
        docs: Version of the Langfuse deployment that generated the report
      clientId:
        type: nullable<string>
        docs: Identifier of this deployment as used by the usage telemetry job, or null if the telemetry job has never run
      licenseKeySuffix:
        type: nullable<string>
        docs: Last 4 characters of LANGFUSE_EE_LICENSE_KEY, so a report can be matched to a contract without exposing the key. Null when no license key is set or the key is 8 characters or shorter.
      billableUnits:
        type: integer
        docs: Sum of traces, observations and scores
      totalProjects:
        type: integer
        docs: Current number of projects that are not deleted. This is a current total, not a count for the window.
      traces:
        type: integer
        docs: Traces created in the window
      scores:
        type: integer
        docs: Scores created in the window
      observations:
        type: integer
        docs: Observations created in the window
      datasets:
        type: integer
        docs: Datasets created in the window
      datasetItems:
        type: integer
        docs: Dataset items created in the window
      datasetRuns:
        type: integer
        docs: Dataset runs created in the window
      datasetRunItems:
        type: integer
        docs: Dataset run items created in the window
      assistantRuns:
        type: integer
        docs: Assistant runs created in the window
      userDomains:
        type: list<UsageReportUserDomain>
        docs: The 30 email domains with the most users and their user counts, most users first. Like totalProjects, this is a current total, not a count for the window.

  UsageReportWindow:
    docs: Creation window of a usage report
    properties:
      start:
        type: datetime
        docs: Inclusive start of the window
      end:
        type: datetime
        docs: Exclusive end of the window

  UsageReportUserDomain:
    docs: Number of users with an email address at a domain
    properties:
      domain: string
      userCount: integer
